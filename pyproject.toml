[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wbapi-async"
version = "1.0.0"
description = "Fast, lightweight async client for the Wildberries Seller API"

authors = [
    { name = "Andrei Serdiukov", email = "asyncdf@gmail.com" },
]
maintainers = [
    { name = "Andrei Serdiukov", email = "asyncdf@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
keywords = ["wb", "wildberries", "api", "client", "async"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiolimiter (>=1.2.1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "msgspec (>=0.19.0)",
    "typing-extensions (>=4.0) ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "ruff (>=0.14.1,<0.15.0)",
    "mypy (>=1.14.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
    "pyyaml (>=6.0)",
]

test = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "pytest-cov (>=6.0.0)",
    "pyyaml (>=6.0)",
]

lint = [
    "ruff (>=0.14.1,<0.15.0)",
    "mypy (>=1.14.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
]

docs = [
    "mkdocs-material (>=9.6.0)",
    "mkdocstrings[python] (>=0.29.0)",
]

[project.urls]
Documentation = "https://github.com/serdukow/wbapi-async#readme"
Repository = "https://github.com/serdukow/wbapi-async"
Changelog = "https://github.com/serdukow/wbapi-async/blob/main/CHANGELOG.md"
Issues = "https://github.com/serdukow/wbapi-async/issues"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/wbapi",
    "README.md",
    "pyproject.toml"
]

[tool.hatch.build.targets.wheel]
packages = ["src/wbapi"]

[tool.ruff]
exclude = [
    ".git",
    "build",
    "dist",
    "venv",
    ".venv",
    "docs",
    "*.egg-info",
]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C4", "B", "RUF100"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["wbapi"]
force-sort-within-sections = true
order-by-type = true
combine-as-imports = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-after-imports = 2

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]
staticmethod-decorators = ["staticmethod"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 60


[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow running tests",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_configs = true
files = ["src/wbapi"]

[[tool.mypy.overrides]]
module = "aiolimiter.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["wbapi"]
branch = true
omit = ["*/resources/*/__init__.py"]

[tool.coverage.report]
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
