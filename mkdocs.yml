site_name: wbapi-async
site_url: https://serdukow.github.io/wbapi-async/
site_description: Asynchronous Python client for Wildberries API
repo_url: https://github.com/serdukow/wbapi-async
repo_name: serdukow/wbapi-async

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            docstring_style: google

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Authentication: getting-started/authentication.md
      - Quick Start: getting-started/quick-start.md
  - API Reference:
      - WbAPI: api/client.md
      - WB API Sections: api/domains.md
  - Advanced:
      - Pagination: advanced/pagination.md
      - Rate Limiting: advanced/rate-limiting.md
      - Error Handling: advanced/error-handling.md
  - Changelog: changelog.md
