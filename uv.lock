[[package]]
name = "wbapi-async"
version = "1.0.0rc1"
source = { editable = "." }
dependencies = [
    { name = "aiolimiter" },
    { name = "httpx" },
    { name = "msgspec" },
    { name = "typing-extensions", marker = "python_full_version < '3.11'" },
]

[package.optional-dependencies]
dev = [
    { name = "mypy" },
    { name = "pre-commit" },
    { name = "pyyaml" },
    { name = "ruff" },
]
docs = [
    { name = "mkdocs-material" },
    { name = "mkdocstrings", extra = ["python"] },
]
lint = [
    { name = "mypy" },
    { name = "pre-commit" },
    { name = "ruff" },
]
test = [
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "pytest-cov" },
    { name = "pyyaml" },
]

