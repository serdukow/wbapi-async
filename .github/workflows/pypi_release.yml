name: PyPI release

on:
  # release-please calls this workflow directly when it cuts a release: a
  # release it creates carries GITHUB_TOKEN, and GitHub will not start a
  # workflow from an event that token raised, so release: published never
  # fires for it.
  workflow_call:
    inputs:
      ref:
        description: The tag to build, since the caller's SHA predates it.
        type: string
        required: true
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # release-please commits the version bump after the run starts, so
          # the caller's SHA still carries the previous version.
          ref: ${{ inputs.ref || github.ref }}

      - name: Refuse to publish from outside main
        run: |
          git fetch origin main
          # HEAD, not GITHUB_SHA: on a called run the latter is the caller's
          # commit, which is not what was checked out or what gets built.
          git merge-base --is-ancestor origin/main HEAD

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Verify the installed package
        run: |
          python -m venv venv
          venv/bin/pip install --quiet dist/*.whl
          venv/bin/python - <<'EOF'
          from importlib.metadata import version
          import wbapi
          from wbapi import WBApi

          dist = version("wbapi-async")
          assert dist == wbapi.__version__, f"{dist} != {wbapi.__version__}"

          api = WBApi(token="verification-token")
          sections = [
              name
              for name in dir(api)
              if not name.startswith("_")
              and name not in {"token", "close", "is_closed", "sandbox"}
          ]
          assert len(sections) == 14, f"expected 14 sections, got {len(sections)}"
          print(f"wbapi-async {dist}: {len(sections)} sections")
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
