name: PyPI release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to publish from outside main
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main $GITHUB_SHA

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Verify the installed package
        run: |
          python -m venv venv
          venv/bin/pip install --quiet dist/*.whl
          venv/bin/python - <<'EOF'
          from importlib.metadata import version
          import wbapi
          from wbapi import WBApi

          dist = version("wbapi-async")
          assert dist == wbapi.__version__, f"{dist} != {wbapi.__version__}"

          api = WBApi(token="verification-token")
          sections = [
              name
              for name in dir(api)
              if not name.startswith("_")
              and name not in {"token", "close", "is_closed", "sandbox"}
          ]
          assert len(sections) == 14, f"expected 14 sections, got {len(sections)}"
          print(f"wbapi-async {dist}: {len(sections)} sections")
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
