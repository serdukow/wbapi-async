name: Tests

on:
  push:
    branches:
      - main

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest --cov --cov-report=term

  coverage:
    # publishes the badge value; runs only on the default branch so forks and
    # pull requests cannot write to the gist
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Measure coverage
        run: |
          uv run pytest --cov --cov-report=json
          # One decimal, not round(): anything above 99.5 was displayed as a
          # flat 100%, so the badge never moved.
          echo "total=$(python -c 'import json;p=json.load(open("coverage.json"))["totals"]["percent_covered"];print(f"{p:.1f}".rstrip("0").rstrip("."))')" >> "$GITHUB_ENV"

      - name: Update badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: wb-api-coverage.json
          label: coverage
          message: ${{ env.total }}%
          valColorRange: ${{ env.total }}
          maxColorRange: 100
          minColorRange: 60
