name: Tests

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/tests.yml"
      - "moysklad_api/**"
      - "tests/**"
      - "pyproject.toml"

  pull_request:
    branches:
      - dev-*
    paths:
      - ".github/workflows/tests.yml"
      - "moysklad_api/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest
