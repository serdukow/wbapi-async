name: Sync Registry

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WBAPI_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install wbapi-codegen and ruff
        run: uv pip install --system wbapi-codegen ruff

      - name: Run codegen
        id: codegen
        run: |
          SWAGGER_DIR=$(mktemp -d)
          BASE="https://dev.wildberries.ru/api/swagger/yaml/en"
          for f in \
            01-general \
            02-products \
            03-orders-fbs \
            04-orders-dbw \
            05-orders-dbs \
            06-in-store-pickup \
            07-orders-fbw \
            08-promotion \
            09-communications \
            10-tariffs \
            11-analytics \
            12-reports \
            13-finances \
          ; do
            curl -fsSL "$BASE/$f.yaml" -o "$SWAGGER_DIR/$f.yaml" \
              && echo "Downloaded $f.yaml" \
              || echo "WARN: failed to download $f.yaml"
          done
          OUTPUT=$(wbapi-codegen --target . --swagger-dir "$SWAGGER_DIR" 2>&1)
          echo "$OUTPUT"
          ruff check --fix --unsafe-fixes src/ tests/ || true
          ruff format src/ tests/

          PATHS_COUNT=$(grep -c '": "https://' src/wbapi_async/_registry.py || true)

          BODY="Automated PR from [wbapi-codegen](https://github.com/serdukow/wbapi-codegen)."$'\n'
          BODY+="Updated registry: **${PATHS_COUNT} paths** from the latest Wildberries OpenAPI specs."

          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.WBAPI_PAT }}
          branch: codegen/sync-registry
          commit-message: "chore: sync _registry.py with latest WB OpenAPI specs"
          title: "chore: sync _registry.py with latest WB OpenAPI specs"
          body: ${{ steps.codegen.outputs.body }}
          labels: codegen
          delete-branch: true
