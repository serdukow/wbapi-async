name: Lint

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lint.yml"
      - "src/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/lint.yml"
      - "src/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff autofix
        run: uv run ruff check src/ --fix --unsafe-fixes || true

      - name: Ruff format
        run: uv run ruff format src/ || true

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: ruff autofix"
          file_pattern: "src/**/*.py"

      - name: Ruff check (fail on remaining errors)
        run: uv run ruff check src/
