name: Codegen

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codegen.yml"
      - "scripts/codegen.py"
      - "specs/**"
      - "src/wbapi/**"

  pull_request:
    paths:
      - ".github/workflows/codegen.yml"
      - "scripts/codegen.py"
      - "specs/**"
      - "src/wbapi/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  up-to-date:
    name: Generated client matches the specs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Test the generator
        run: uv run pytest tests/test_codegen.py -q

      - name: Regenerate
        run: uv run python scripts/codegen.py

      - name: Fail if the client is stale
        run: |
          if ! git diff --quiet -- src/wbapi; then
            echo "::error::src/wbapi is out of date. Run: uv run python scripts/codegen.py"
            git diff --stat -- src/wbapi
            exit 1
          fi
          echo "Generated client is up to date."

      - name: Test the regenerated client
        run: uv run pytest -q
