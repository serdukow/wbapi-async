name: Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit.yml"
      - "pyproject.toml"
      - "uv.lock"

  pull_request:
    paths:
      - ".github/workflows/audit.yml"
      - "pyproject.toml"
      - "uv.lock"

  schedule:
    # An advisory can land against a dependency that has not changed.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: Known advisories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Audit the runtime dependencies
        run: uv run --with pip-audit pip-audit --progress-spinner off
