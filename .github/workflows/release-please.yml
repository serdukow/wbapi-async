name: Release Please

on:
  push:
    branches:
      - main
  # Lets a release be cut without waiting for the next push to main.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest

    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

    steps:
      # Settings live in release-please-config.json so the workflow and the
      # config cannot drift apart.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report
        if: steps.release.outputs.release_created == 'true'
        run: echo "::notice::Released ${{ steps.release.outputs.tag_name }}"

  publish:
    name: Start the PyPI release
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      # Dispatched rather than called: a called workflow signs its artifact
      # with the caller's identity, so PyPI saw release-please.yml where the
      # trusted publisher names pypi_release.yml. Dispatching keeps the OIDC
      # claim on the workflow that actually uploads.
      - name: Dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh workflow run pypi_release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field ref="$TAG"
